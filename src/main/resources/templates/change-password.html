<!DOCTYPE html>
<html lang="ru"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>Смена пароля</title>
</head>
<body>
<div layout:fragment="content">

    <section class="page-header">
        <div class="container">
            <h1>Смена пароля</h1>
            <p>Здравствуйте, <span th:text="${user.firstName}">пользователь</span>!</p>
        </div>
    </section>

    <section>
        <div class="container">

            <div th:if="${errorMessage}" class="error-msg" th:text="${errorMessage}"></div>

            <form th:action="@{/profile/change-password}"
                  th:object="${passwordForm}"
                  method="post"
                  class="order-form">

                <label>Текущий пароль</label>
                <input type="password" th:field="*{currentPassword}" required>
                <span class="field-error" th:if="${#fields.hasErrors('currentPassword')}"
                      th:errors="*{currentPassword}">Ошибка</span>

                <label>Новый пароль</label>
                <input type="password" th:field="*{newPassword}" required>
                <span class="field-error" th:if="${#fields.hasErrors('newPassword')}"
                      th:errors="*{newPassword}">Ошибка</span>

                <label>Повторите новый пароль</label>
                <input type="password" th:field="*{confirmPassword}" required>
                <span class="field-error" th:if="${#fields.hasErrors('confirmPassword')}"
                      th:errors="*{confirmPassword}">Ошибка</span>

                <div style="margin-top: 20px; display: flex; gap: 8px;">
                    <button type="submit" class="btn btn-primary">Сохранить</button>
                    <a th:href="@{/profile}" class="btn"
                       style="background:#F2EAE0; color:#8B5E3C;">Отмена</a>
                </div>
            </form>
        </div>
    </section>

</div>
</body>
</html>
