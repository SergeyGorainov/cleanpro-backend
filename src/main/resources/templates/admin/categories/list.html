<!DOCTYPE html>
<html lang="ru"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>Категории — админка</title>
</head>
<body>
<div layout:fragment="content">

    <section class="page-header">
        <div class="container">
            <h1>Категории услуг</h1>
            <p>Всего: <b th:text="${categories.size()}">0</b></p>
        </div>
    </section>

    <section>
        <div class="container">

            <div class="admin-filters">
                <a th:href="@{/admin/categories/new}" class="btn btn-primary">+ Добавить категорию</a>
                <a th:href="@{/admin}" class="filter-btn">← Дашборд</a>
                <a th:href="@{/admin/services}" class="filter-btn">Услуги →</a>
            </div>

            <table class="orders-table">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Slug</th>
                    <th>Название</th>
                    <th>Описание</th>
                    <th>Порядок</th>
                    <th>Активна</th>
                    <th>Действия</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="c : ${categories}">
                    <td th:text="${c.id}">1</td>
                    <td><code th:text="${c.slug}">cleaning</code></td>
                    <td th:text="${c.title}">Уборка</td>
                    <td th:text="${#strings.abbreviate(c.description, 60)}">Описание...</td>
                    <td th:text="${c.sortOrder}">10</td>
                    <td>
                        <span class="status-badge"
                              th:classappend="${c.active} ? 'status-DONE' : 'status-NEW'"
                              th:text="${c.active} ? 'Да' : 'Нет'">Да</span>
                    </td>
                    <td class="actions">
                        <a th:href="@{'/admin/categories/' + ${c.id} + '/edit'}"
                           class="btn" style="background:#eef5fb; color:#0077cc;">✎</a>

                        <form th:action="@{'/admin/categories/' + ${c.id} + '/toggle'}"
                              method="post" style="display:inline;">
                            <button type="submit" class="btn" style="background:#f1f5f8;">⇄</button>
                        </form>

                        <form th:action="@{'/admin/categories/' + ${c.id} + '/delete'}"
                              method="post" style="display:inline;"
                              onsubmit="return confirm('Удалить категорию? Все связанные услуги тоже могут сломаться.');">
                            <button type="submit" class="btn-delete">✕</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>

        </div>
    </section>

</div>
</body>
</html>
