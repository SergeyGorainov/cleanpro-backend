<!DOCTYPE html>
<html lang="ru"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>Услуги — админка</title>
</head>
<body>
<div layout:fragment="content">

    <section class="page-header">
        <div class="container">
            <h1>Услуги</h1>
            <p>Всего: <b th:text="${services.size()}">0</b></p>
        </div>
    </section>

    <section>
        <div class="container">

            <div class="admin-filters">
                <a th:href="@{/admin/services/new}" class="btn btn-primary">+ Добавить услугу</a>
                <a th:href="@{/admin}" class="filter-btn">← Дашборд</a>
                <a th:href="@{/admin/categories}" class="filter-btn">Категории</a>
                <a th:href="@{/admin/reviews}" class="filter-btn">Отзывы →</a>
            </div>

            <table class="orders-table">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Slug</th>
                    <th>Название</th>
                    <th>Категория</th>
                    <th>Цена от</th>
                    <th>Порядок</th>
                    <th>Активна</th>
                    <th>Действия</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="s : ${services}">
                    <td th:text="${s.id}">1</td>
                    <td><code th:text="${s.slug}">general</code></td>
                    <td th:text="${s.title}">Генеральная уборка</td>
                    <td th:text="${s.category != null ? s.category.title : '—'}">Уборка</td>
                    <td th:text="${s.priceFrom} + ' ₽'">4500 ₽</td>
                    <td th:text="${s.sortOrder}">10</td>
                    <td>
        <span class="status-badge"
              th:classappend="${s.active} ? 'status-DONE' : 'status-NEW'"
              th:text="${s.active} ? 'Да' : 'Нет'">Да</span>
                    </td>
                    <td class="actions">
                        <a th:href="@{'/admin/services/' + ${s.id} + '/edit'}"
                           class="btn" style="background:#eef5fb; color:#0077cc;">✎</a>

                        <form th:action="@{'/admin/services/' + ${s.id} + '/toggle'}"
                              method="post" style="display:inline;">
                            <button type="submit" class="btn" style="background:#f1f5f8;">⇄</button>
                        </form>

                        <form th:action="@{'/admin/services/' + ${s.id} + '/delete'}"
                              method="post" style="display:inline;"
                              onsubmit="return confirm('Удалить услугу?');">
                            <button type="submit" class="btn-delete">✕</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>

        </div>
    </section>

</div>
</body>
</html>
