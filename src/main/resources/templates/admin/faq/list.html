<!DOCTYPE html>
<html lang="ru"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>FAQ — админка</title>
</head>
<body>
<div layout:fragment="content">

    <section class="page-header">
        <div class="container">
            <h1>Частые вопросы (FAQ)</h1>
            <p>Всего: <b th:text="${faqs.size()}">0</b></p>
        </div>
    </section>

    <section>
        <div class="container">

            <div class="admin-filters">
                <a th:href="@{/admin/faq/new}" class="btn btn-primary">+ Добавить вопрос</a>
                <a th:href="@{/admin}" class="filter-btn">← Дашборд</a>
                <a th:href="@{/admin/reviews}" class="filter-btn">Отзывы</a>
            </div>

            <table class="orders-table">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Категория</th>
                    <th>Вопрос</th>
                    <th>Порядок</th>
                    <th>Активен</th>
                    <th>Действия</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="f : ${faqs}">
                    <td th:text="${f.id}">1</td>
                    <td th:text="${f.category} ?: '—'">himchistka</td>
                    <td th:text="${#strings.abbreviate(f.question, 60)}">Вопрос...</td>
                    <td th:text="${f.sortOrder}">10</td>
                    <td>
                        <span class="status-badge"
                              th:classappend="${f.active} ? 'status-DONE' : 'status-NEW'"
                              th:text="${f.active} ? 'Да' : 'Нет'">Да</span>
                    </td>
                    <td class="actions">
                        <a th:href="@{'/admin/faq/' + ${f.id} + '/edit'}"
                           class="btn" style="background:#eef5fb; color:#0077cc;">✎</a>

                        <form th:action="@{'/admin/faq/' + ${f.id} + '/toggle'}"
                              method="post" style="display:inline;">
                            <button type="submit" class="btn" style="background:#f1f5f8;">⇄</button>
                        </form>

                        <form th:action="@{'/admin/faq/' + ${f.id} + '/delete'}"
                              method="post" style="display:inline;"
                              onsubmit="return confirm('Удалить вопрос?');">
                            <button type="submit" class="btn-delete">✕</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>

        </div>
    </section>

</div>
</body>
</html>
