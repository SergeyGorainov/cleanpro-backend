<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>

<!-- ===== ПУБЛИЧНОЕ МЕНЮ ===== -->
<nav th:fragment="nav" class="site-nav">
    <div class="container nav-inner">

        <!-- Бургер для мобильных -->
        <button type="button" class="nav-burger" id="navBurger" aria-label="Меню">
            <span></span>
            <span></span>
            <span></span>
        </button>

        <!-- Обёртка для всего меню (для мобильной версии) -->
        <div class="nav-mobile-wrap" id="navMobileWrap">

            <!-- Левая группа: навигация -->
            <ul class="nav-links">
                <li><a th:href="@{/}">Главная</a></li>
                <li><a th:href="@{/services}">Услуги</a></li>
                <li><a th:href="@{/#calc}">Калькулятор</a></li>
                <li><a th:href="@{/contacts}">Контакты</a></li>
            </ul>

            <!-- Правая группа: поиск + авторизация -->
            <div class="nav-right">

                <!-- Поиск -->
                <form action="/search" method="get" class="nav-search">
                    <input type="text"
                           name="q"
                           placeholder="Поиск по сайту..."
                           autocomplete="off">
                    <button type="submit" aria-label="Найти">🔍</button>
                </form>

                <!-- Авторизация -->
                <ul class="nav-auth">
                    <li sec:authorize="hasRole('ADMIN')">
                        <a th:href="@{/admin}">Панель</a>
                    </li>
                    <li sec:authorize="hasRole('EMPLOYEE')">
                        <a th:href="@{/admin/orders}">Заявки</a>
                    </li>
                    <li sec:authorize="hasRole('USER')">
                        <a th:href="@{/profile}">Личный кабинет</a>
                    </li>
                    <li sec:authorize="!isAuthenticated()">
                        <a th:href="@{/register}">Регистрация</a>
                    </li>
                    <li sec:authorize="isAuthenticated()">
                        <form th:action="@{/logout}" method="post" style="display:inline;">
                            <button type="submit" class="nav-logout">Выйти</button>
                        </form>
                    </li>
                    <li sec:authorize="!isAuthenticated()">
                        <a th:href="@{/login}">Войти</a>
                    </li>
                </ul>

            </div>
        </div>
    </div>
</nav>

</body>
</html>
