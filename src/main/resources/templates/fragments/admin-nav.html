<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>

<!-- ===== АДМИН-ПОЛОСА — полная, только для ADMIN ===== -->
<nav th:fragment="adminNav" class="admin-nav" sec:authorize="hasRole('ADMIN')">
    <div class="container">
        <span class="admin-nav-label">⚙ Админка:</span>
        <ul>
            <li><a th:href="@{/admin}">Дашборд</a></li>
            <li><a th:href="@{/admin/orders}">Заявки</a></li>
            <li><a th:href="@{/admin/services}">Услуги</a></li>
            <li><a th:href="@{/admin/categories}">Категории</a></li>
            <li><a th:href="@{/admin/reviews}">Отзывы</a></li>
            <li><a th:href="@{/admin/faq}">FAQ</a></li>
            <li><a th:href="@{/admin/calculator}">Калькулятор</a></li>
            <li><a th:href="@{/admin/users}">Пользователи</a></li>
        </ul>
    </div>
</nav>

<!-- ===== ПОЛОСА СОТРУДНИКА — только для EMPLOYEE ===== -->
<nav th:fragment="employeeNav" class="admin-nav employee-nav" sec:authorize="hasRole('EMPLOYEE')">
    <div class="container">
        <span class="admin-nav-label">👤 Сотрудник:</span>
        <ul>
            <li><a th:href="@{/admin/orders}">Заявки</a></li>
        </ul>
    </div>
</nav>

</body>
</html>
